# Checks server.json against the MCP registry schema it declares.
name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock ajv@8 ajv-formats@3
      - name: Validate server.json
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          import Ajv from 'ajv';
          import addFormats from 'ajv-formats';

          const doc = JSON.parse(readFileSync('server.json', 'utf8'));
          const schema = await (await fetch(doc.$schema)).json();
          delete schema.$schema;
          const ajv = new Ajv({ strict: false, allErrors: true });
          addFormats(ajv);
          const validate = ajv.compile(schema);
          if (!validate(doc)) {
            console.error(JSON.stringify(validate.errors, null, 2));
            process.exit(1);
          }
          console.log(`server.json is valid against ${doc.$schema}`);
          EOF
